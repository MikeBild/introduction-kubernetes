# The base: everything that is the same in every environment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: werkstatt
labels:
  - pairs:
      app.kubernetes.io/part-of: werkstatt-shop
resources:
  - 00-namespace.yaml
  - postgres.yaml
  - shop-api.yaml
  - service.yaml
# The ConfigMap is generated from literals. Kustomize appends a hash to the name –
# if a value changes, the name changes, and the Deployment rolls out again.
configMapGenerator:
  - name: shop-api-config
    literals:
      - PORT=3000
      - DB_HOST=postgres
      - DB_NAME=shop
      - DB_USER=postgres
