# You start Deployments, not Pods: the Deployment keeps two replicas alive.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: werkstatt
  labels:
    app.kubernetes.io/name: shop-api
    app.kubernetes.io/part-of: werkstatt-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-api
        app.kubernetes.io/part-of: werkstatt-shop
    spec:
      containers:
        - name: api
          image: shop-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Plain text for now – the lesson on ConfigMaps and Secrets cleans this up.
            - name: DATABASE_URL
              value: postgres://postgres:werkstatt@postgres:5432/shop
