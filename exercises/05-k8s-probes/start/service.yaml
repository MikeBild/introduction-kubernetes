# A Service gives the Pods a stable name and a stable address in the cluster.
# It selects the Pods by labels, not by names or IPs.
apiVersion: v1
kind: Service
metadata:
  name: shop-api
  namespace: werkstatt
  labels:
    app.kubernetes.io/name: shop-api
    app.kubernetes.io/part-of: werkstatt-shop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shop-api
  ports:
    - name: http
      port: 80
      targetPort: http
