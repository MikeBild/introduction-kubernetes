# Configuration does not belong in the image: values go into the ConfigMap, secrets into the Secret.
# The Secret shop-db already lives in postgres.yaml – the API reads only the password from it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-api-config
  namespace: werkstatt
  labels:
    app.kubernetes.io/name: shop-api
data:
  PORT: "3000"
  DB_HOST: postgres
  DB_NAME: shop
  DB_USER: postgres
