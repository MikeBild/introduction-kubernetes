# Probes sagen Kubernetes, ob der Pod lebt und ob er Traffic bekommen soll.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: werkstatt
  labels:
    app.kubernetes.io/name: shop-api
    app.kubernetes.io/part-of: werkstatt-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-api
        app.kubernetes.io/part-of: werkstatt-shop
    spec:
      containers:
        - name: api
          image: shop-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # Startup: Erst wenn diese Probe einmal klappt, beginnen Liveness und Readiness.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Liveness: Hängt der Prozess? Dann startet das Kubelet den Container neu.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: Soll der Pod Traffic bekommen? Sonst nimmt ihn der Service heraus.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          # Alle Schlüssel der ConfigMap als Umgebungsvariablen.
          envFrom:
            - configMapRef:
                name: shop-api-config
          env:
            # Nur das Passwort aus dem Secret, nicht das ganze Secret.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: POSTGRES_PASSWORD
            # $(NAME) setzt Variablen ein, die vorher definiert sind.
            - name: DATABASE_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)
