# Der Pod erfüllt das Profil restricted: kein root, keine Capabilities, Dateisystem read-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: werkstatt
  labels:
    app.kubernetes.io/name: shop-api
    app.kubernetes.io/part-of: werkstatt-shop
spec:
  replicas: 3
  # Ein neuer Pod muss fünf Sekunden bereit sein, bevor der nächste dran ist.
  minReadySeconds: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-api
        app.kubernetes.io/part-of: werkstatt-shop
    spec:
      terminationGracePeriodSeconds: 30
      # Die API braucht keinen Zugriff auf die Kubernetes API – also kein Token im Pod.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: shop-api:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          # Startup: Erst wenn diese Probe einmal klappt, beginnen Liveness und Readiness.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Liveness: Hängt der Prozess? Dann startet das Kubelet den Container neu.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: Soll der Pod Traffic bekommen? Sonst nimmt ihn der Service heraus.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          # Requests reservieren Platz auf dem Node, Limits ziehen die Grenze.
          # Kein CPU-Limit: Es bremst nur. Memory-Limit = Request macht den Speicher berechenbar.
          # Node.js 26 nimmt etwa die Hälfte des Limits als Heap, aber nie unter rund 256 MB.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          # Kurz warten, bis Service und Gateway den Pod aus dem Routing genommen haben.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Alle Schlüssel der ConfigMap als Umgebungsvariablen.
          envFrom:
            - configMapRef:
                name: shop-api-config
          env:
            # Nur das Passwort aus dem Secret, nicht das ganze Secret.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: POSTGRES_PASSWORD
            # $(NAME) setzt Variablen ein, die vorher definiert sind.
            - name: DATABASE_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)
