# Angepasst: Pod Security Admission setzt im Namespace das Profil restricted durch.
# Pods that violate it are rejected by the API server already on creation.
apiVersion: v1
kind: Namespace
metadata:
  name: werkstatt
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
