# Angepasst: Postgres 18 im Profil restricted – als User postgres (999) statt als root.
# Postgres 18 für den Werkstatt-Shop – gegeben, damit du dich auf die API konzentrierst.
# StatefulSet mit eigenem Volume je Pod, Headless Service für einen festen DNS-Namen.
apiVersion: v1
kind: Secret
metadata:
  name: shop-db
  namespace: werkstatt
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: werkstatt
  POSTGRES_DB: shop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: werkstatt
data:
  init.sql: |
    create table if not exists products (
      id text primary key,
      name text not null,
      price_cents integer not null check (price_cents >= 0),
      stock integer not null check (stock >= 0)
    );
    create table if not exists orders (
      id uuid primary key,
      customer_id text not null,
      status text not null check (status in ('draft', 'placed', 'paid', 'shipped', 'cancelled')),
      created_at timestamptz not null
    );
    create table if not exists order_items (
      order_id uuid not null references orders (id),
      product_id text not null references products (id),
      quantity integer not null check (quantity >= 1),
      price_cents integer not null check (price_cents >= 0),
      primary key (order_id, product_id)
    );
    insert into products (id, name, price_cents, stock) values
      ('p-hammer', 'Schlosserhammer 500 g', 1990, 25),
      ('p-zange', 'Kombizange 180 mm', 1490, 40),
      ('p-bits', 'Bit-Satz 32-teilig', 2490, 15)
    on conflict (id) do nothing;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: werkstatt
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: werkstatt
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: werkstatt-shop
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: werkstatt-shop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: shop-db
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "shop"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
