# Ein lokaler Cluster mit einem Control Plane Node und zwei Worker Nodes.
# Jeder Node ist ein Docker-Container mit Upstream-Kubernetes (kubeadm).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: werkstatt
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
