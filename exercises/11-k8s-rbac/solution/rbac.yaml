# Each identity gets exactly the permissions it needs – and only in its namespace.

# The API itself never talks to the Kubernetes API: its own ServiceAccount, no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-api
  namespace: werkstatt
automountServiceAccountToken: false
---
# The CI rolls out new versions. It needs Deployments, but no Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: werkstatt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: werkstatt
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: werkstatt
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: werkstatt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
