# The API runs with its own ServiceAccount and without a token for the Kubernetes API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: werkstatt
  labels:
    app.kubernetes.io/name: shop-api
    app.kubernetes.io/part-of: werkstatt-shop
spec:
  replicas: 3
  # A new Pod must be ready for five seconds before the next one follows.
  minReadySeconds: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-api
        app.kubernetes.io/part-of: werkstatt-shop
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: shop-api
      automountServiceAccountToken: false
      containers:
        - name: api
          image: shop-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # Startup: liveness and readiness start only after this probe has succeeded once.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Liveness: is the process stuck? Then the kubelet restarts the container.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: should the Pod receive traffic? Otherwise the Service removes it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          # Requests reserve room on the node, limits draw the line.
          # No CPU limit: it only throttles. Memory limit = request makes memory predictable.
          # Node.js 26 takes about half of the limit as heap, but never less than roughly 256 MB.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          # Wait briefly until Service and Gateway have taken the Pod out of routing.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # All keys of the ConfigMap as environment variables.
          envFrom:
            - configMapRef:
                name: shop-api-config
          env:
            # Only the password from the Secret, not the whole Secret.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: POSTGRES_PASSWORD
            # $(NAME) substitutes variables that are defined earlier.
            - name: DATABASE_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)
