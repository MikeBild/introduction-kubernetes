# By default every Pod can reach every Pod. These policies turn that around:
# first deny everything, then allow exactly the paths the shop needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: werkstatt
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Gateway → API: only the Envoy proxy from envoy-gateway-system, only on port http.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-api
  namespace: werkstatt
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shop-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: http
---
# API → Postgres: only Pods of the API, only port 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-postgres
  namespace: werkstatt
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shop-api
      ports:
        - port: 5432
