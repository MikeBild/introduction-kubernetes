# By default every Pod can reach every Pod. These policies turn that around.
# TODO 1: default-deny-ingress: empty podSelector, policyTypes [Ingress], no rules.
# TODO 2: allow-gateway-to-api: Pods shop-api accept only from the namespace envoy-gateway-system, port http.
# TODO 3: allow-api-to-postgres: Pods postgres accept only from Pods shop-api, port 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: werkstatt
spec:
  podSelector: {}
