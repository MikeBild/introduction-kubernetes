# Gateway API: three roles, three objects.
# GatewayClass – which implementation? (platform team)
# Gateway      – which entry point, which port? (cluster operations)
# HTTPRoute    – which path to which Service? (app team)
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: werkstatt
  namespace: werkstatt
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-api
  namespace: werkstatt
spec:
  parentRefs:
    - name: werkstatt
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        # /api/products becomes /products – the API does not know the prefix.
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: shop-api
          port: 80
